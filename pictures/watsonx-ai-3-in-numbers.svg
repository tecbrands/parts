<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 618" width="1200" height="618" role="img" aria-labelledby="wx3-t wx3-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="wx3-t">watsonx.ai in three of IBM’s published results</title><desc id="wx3-d">UHCW NHS Trust saw more than 700 additional patients each week without added staff. CrushBank used watsonx.ai and watsonx.data to help IT support teams resolve 40% more help desk tickets per day. UFC scaled insight generation for more than 40 live events, with an estimated 3x increase in insight volume. Each figure is a customer result IBM publishes on its watsonx.ai page. IBM marks UFC’s figures as estimates.</desc><defs><radialGradient id="wx3-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="wx3-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="wx3-dawn" cx="585" cy="465" r="252" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="wx3-hz" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="wx3-ground" cx="585" cy="465" r="230" gradientUnits="userSpaceOnUse" gradientTransform="translate(585 465) scale(1 0.3) translate(-585 -465)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="618" fill="#262B4B"/><rect width="1200" height="465" fill="url(#wx3-dawn)"/><path d="M455 465A130 130 0 0 1 715 465" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.5"/><path d="M437 465A148 148 0 0 1 733 465" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.26"/><path d="M473 465A112 112 0 0 1 697 465Z" fill="url(#wx3-sun)"/><path d="M355 465A230 70 0 0 0 815 465Z" fill="url(#wx3-ground)"/><rect x="0" y="464" width="1200" height="2" fill="url(#wx3-hz)"/><rect x="500" y="487" width="170" height="5" fill="#E86877" fill-opacity="0.78"/><rect x="529" y="509" width="112" height="5" fill="#E86877" fill-opacity="0.54"/><rect x="555" y="531" width="60" height="5" fill="#E86877" fill-opacity="0.34"/><rect x="56" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="56" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="300" fill="#F9F8F5" text-anchor="start">700+</text><text x="56" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">more patients a week</text><text x="56" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">UHCW NHS Trust, without added staff, IBM</text><text x="56" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">reports.</text><rect x="435" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="435" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="300" fill="#F9F8F5" text-anchor="start">40%</text><text x="435" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">more help desk tickets resolved a</text><text x="435" y="200" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">day</text><text x="435" y="232" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">CrushBank, with watsonx.ai and watsonx.data, IBM</text><text x="435" y="252" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">reports.</text><rect x="814" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="814" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="300" fill="#F9F8F5" text-anchor="start">40+</text><text x="814" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">live events</text><text x="814" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">UFC scaled insight generation, with an estimated</text><text x="814" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">3x increase in insight volume, IBM reports.</text><rect x="56" y="314.96" width="220" height="124" fill="#262B4B" stroke="#F9F8F5" stroke-width="2"/><rect x="60.4" y="319.92" width="211.2" height="114.08" fill="none" stroke="#C9CBD6" stroke-width="1" opacity="0.85"/><path d="M157.2 438.96V458.8M174.8 438.96V458.8" stroke="#F9F8F5" stroke-width="1.6" fill="none"