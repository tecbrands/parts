<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 618" width="1200" height="618" role="img" aria-labelledby="am3-t am3-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="am3-t">IBM Maximo Application Suite in three of IBM’s figures</title><desc id="am3-d">Three of IBM's figures for Maximo Application Suite: a guided trial of two capabilities, Manage and Health; one entitlement of AppPoints for functionality and users; 10,000 field technicians supported by IBM Maximo at Transport for London. Each figure is IBM's, from its Maximo Application Suite and pricing pages. IBM does not state the trial's length, and states no period or measurement for the Transport for London figure.</desc><defs><radialGradient id="am3-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="am3-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="am3-dawn" cx="585" cy="465" r="252" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="am3-hz" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="am3-ground" cx="585" cy="465" r="230" gradientUnits="userSpaceOnUse" gradientTransform="translate(585 465) scale(1 0.3) translate(-585 -465)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="618" fill="#262B4B"/><rect width="1200" height="465" fill="url(#am3-dawn)"/><path d="M455 465A130 130 0 0 1 715 465" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.5"/><path d="M437 465A148 148 0 0 1 733 465" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.26"/><path d="M473 465A112 112 0 0 1 697 465Z" fill="url(#am3-sun)"/><path d="M355 465A230 70 0 0 0 815 465Z" fill="url(#am3-ground)"/><rect x="0" y="464" width="1200" height="2" fill="url(#am3-hz)"/><rect x="500" y="487" width="170" height="5" fill="#E86877" fill-opacity="0.78"/><rect x="529" y="509" width="112" height="5" fill="#E86877" fill-opacity="0.54"/><rect x="555" y="531" width="60" height="5" fill="#E86877" fill-opacity="0.34"/><rect x="56" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="56" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#F9F8F5" text-anchor="start">2</text><text x="56" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">capabilities in the guided trial</text><text x="56" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Manage, for enterprise asset management, and</text><text x="56" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Health, for predictive maintenance.</text><rect x="435" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="435" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-s