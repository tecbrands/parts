<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-labelledby="evs3-t evs3-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="evs3-t">IBM Confluent Cloud in three of IBM’s figures</title><desc id="evs3-d">Three of IBM’s figures for IBM Confluent Cloud: a 99.99% uptime SLA for production workloads; 150 pre-built connectors; GBps+ workloads with elastic scaling. The drawing shows one stream of events from a database to an open table. Each figure is IBM’s, from its IBM Confluent page. Confluent’s own page states that the 99.99% uptime SLA applies to production workloads; IBM states no test conditions for the other two.</desc><defs><radialGradient id="evs3-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="evs3-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="evs3-dawn" cx="600" cy="424" r="252" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="evs3-hz" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="evs3-ground" cx="600" cy="424" r="230" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 424) scale(1 0.3) translate(-600 -424)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="554" fill="#262B4B"/><rect width="1200" height="424" fill="url(#evs3-dawn)"/><path d="M470 424A130 130 0 0 1 730 424" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.5"/><path d="M452 424A148 148 0 0 1 748 424" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.26"/><path d="M488 424A112 112 0 0 1 712 424Z" fill="url(#evs3-sun)"/><path d="M370 424A230 70 0 0 0 830 424Z" fill="url(#evs3-ground)"/><rect x="0" y="423" width="1200" height="2" fill="url(#evs3-hz)"/><rect x="515" y="446" width="170" height="5" fill="#E86877" fill-opacity="0.78"/><rect x="544" y="468" width="112" height="5" fill="#E86877" fill-opacity="0.54"/><rect x="570" y="490" width="60" height="5" fill="#E86877" fill-opacity="0.34"/><rect x="56" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="56" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="300" fill="#F9F8F5" text-anchor="start">99.99%</text><text x="56" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">uptime SLA*</text><text x="56" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM states it for IBM Confluent Cloud, for</text><text x="56" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">production workloads.</text><rect x="435" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="435" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="300" fill="#F9F8F5" text-anchor="start">150</text><text x="435" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">pre-built connectors*</text><text x="435" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">For databases, SaaS apps, on-premises systems</text><text x="435" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">and cloud services.</text><rect x="814" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="814" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="300" fill="#F9F8F5" text-anchor="start">GBps+</text><text x="814" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">workloads*</text><text x="814" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM says IBM Confluent Cloud supports them,</text><text x="814" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">with elastic scaling.</text><path d="M80 317.5V410.5A45 13.5 0 0 0 170 410.5V317.5" stroke="#F9F8F5" stroke-width="1.8" fill="#262B4B" stroke-linejoin="miter"/><ellipse cx="125" cy="317.5" rx="45" ry="13.5" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.8"/><path d="M80 348.5A45 13.5 0 0 0 170 348.5" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M80 379.5A45 13.5 0 0 0 170 379.5" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M190 364H1000M990 357L1000 364L990 371" stroke="#C9CBD6" stroke-width="1.4" fill="none" stroke-linejoin="miter"/><rect x="251" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><rect x="341" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><rect x="431" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><rect x="521" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><circle cx="620" cy="364" r="30" fill="url(#evs3-halo)"/><rect x="614" y="358" width="12" height="12" fill="#FF9640"/><rect x="701" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><rect x="791" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><rect x="881" y="357" width="18" height="14" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.2"/><rect x="1010" y="324" width="120" height="100" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.8"/><path d="M1010 344H1130" stroke="#F9F8F5" stroke-width="1.2" fill="none" stroke-linejoin="miter"/><path d="M1010 364H1130" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M1010 384H1130" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M1010 404H1130" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M1050 324V424" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M1090 324V424" stroke="#C9CBD6" stroke-width="1" fill="none" stroke-linejoin="miter" opacity="0.7"/><text x="56" y="484" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">* Each figure is IBM’s, from its IBM Confluent page. Confluent’s own page states that the 99.99% uptime SLA applies to production workloads; IBM states no test</text><text x="56" y="504" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">conditions for the other two.</text><text x="56" y="528" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Sources: ibm.com/products/confluent and confluent.io (both read October 24, 2026).</text></svg>