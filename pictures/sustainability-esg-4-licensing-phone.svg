286.24" y="88.77" width="39.23" height="5.23" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.12"/><circle cx="321.54" cy="91.39" r="6.54" fill="url(#es4p-halo)"/><rect x="320.56" y="90.41" width="1.96" height="1.96" fill="#FF9640"/><rect x="28" y="204" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="236" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Essentials</text><text x="28" y="262" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">Up to 1,000 Accounts.</text><rect x="28" y="284" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="316" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Standard</text><text x="28" y="342" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">1,001 to 5,000 Accounts.</text><rect x="28" y="364" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="396" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Premium</text><text x="28" y="422" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">5,001 to 15,000+ Accounts.</text><rect x="28" y="444" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="470" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM defines Accounts as units that track</text><text x="28" y="490" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">different types of activity data, supplier data,</text><text x="28" y="510" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">performance KPIs, etc. IBM says add-ons such</text><text x="28" y="530" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">as ESG reporting or Scope 1, 2 and 3</text><text x="28" y="550" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">calculations adjust the final price. Source:</text><text x="28" y="570" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM, ibm.com/products/envizi/pricing (read</text><text x="28" y="590" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">October 24, 2026).</text></svg>