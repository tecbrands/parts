er month.</text><rect x="28" y="433" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="465" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Mobile Security Suite</text><text x="28" y="491" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">Listed by IBM as SaaS. Per managed</text><text x="28" y="514" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">client device per month.</text><rect x="28" y="536" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="562" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM's license units for MaaS360, as its pricing</text><text x="28" y="582" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">page states them. Source: IBM,</text><text x="28" y="602" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">ibm.com/products/maas360/pricing (read</text><text x="28" y="622" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">October 24, 2026).</text></svg>