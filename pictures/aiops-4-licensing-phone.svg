<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 661" width="360" height="661" role="img" aria-labelledby="aiops4p-t aiops4p-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="aiops4p-t">Three ways to run IBM Concert</title><desc id="aiops4p-d">Three ways to run IBM Concert: a free 30-day trial with all of Concert's features and no credit card; pay-per-use, by the hour per Resource Unit, with no long-term contract; Essentials, an annual subscription per instance with a 20,000 Resource Unit annual base. IBM also offers Concert Enterprise, by arrangement with IBM.</desc><defs><radialGradient id="aiops4p-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="aiops4p-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="aiops4p-dawn" cx="180" cy="128" r="144" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="aiops4p-hz" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="aiops4p-ground" cx="180" cy="128" r="130" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 128) scale(1 0.34) translate(-180 -128)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="360" height="661" fill="#262B4B"/><rect width="360" height="128" fill="url(#aiops4p-dawn)"/><path d="M106 128A74 74 0 0 1 254 128" fill="none" stroke="#E86877" stroke-width="1.5" stroke-opacity="0.5"/><path d="M96 128A84 84 0 0 1 264 128" fill="none" stroke="#E86877" stroke-width="1.5" stroke-opacity="0.26"/><path d="M116 128A64 64 0 0 1 244 128Z" fill="url(#aiops4p-sun)"/><path d="M50 128A130 44 0 0 0 310 128Z" fill="url(#aiops4p-ground)"/><rect x="0" y="127" width="360" height="2" fill="url(#aiops4p-hz)"/><rect x="132" y="142" width="96" height="4" fill="#E86877" fill-opacity="0.78"/><rect x="148" y="156" width="64" height="4" fill="#E86877" fill-opacity="0.54"/><rect x="163" y="170" width="34" height="4" fill="#E86877" fill-opacity="0.34"/><path d="M50.32 91.81H77.46M50.32 128H77.46" stroke="#F9F8F5" stroke-width="1.6" fill="none" stroke-linejoin="miter"/><path d="M53.03 91.81L63.89 109.9L53.03 128M74.75 91.81L63.89 109.9L74.75 128" stroke="#F9F8F5" stroke-width="1.44" fill="none" stroke-linejoin="miter"/><path d="M58.46 127.4L63.89 120.04L69.32 127.4Z" stroke="#C9CBD6" stroke-width="0.8" fill="#C9CBD6" stroke-linejoin="miter" opacity="0.6"/><circle cx="63.89" cy="109.9" r="6.63" fill="url(#aiops4p-halo)"/><rect x="62.83" y="108.85" width="2.11" height="2.11" fill="#FF9640"/><circle cx="180" cy="108.1" r="18.7" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.6"/><path d="M180 95.01V108.1L189.35 112.77" stroke="#C9CBD6" stroke-width="1.44" fill="none" stroke-linejoin="miter"/><path d="M282.54 85.78H307.75L315.71 93.74V128H282.54Z" stroke="#F9F8F5" stroke-width="1.28" fill="#262B4B" stroke-linejoin="miter"/><path d="M307.75 85.78V93.74H315.71" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter"/><path d="M287.18 97.26H311.07" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M287.18 102.75H307.75" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M287.18 108.24H311.07" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M287.18 113.72H307.75" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><rect x="28" y="204" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="236" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Trial</text><text x="28" y="262" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">Free for 30 days, all of Concert’s</text><text x="28" y="285" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">features, no credit card required.</text><rect x="28" y="307" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="339" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Pay-per-use</text><text x="28" y="365" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">By the hour, per Resource Unit, with no</text><text x="28" y="388" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">long-term contract.</text><rect x="28" y="410" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="442" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#F9F8F5" text-anchor="start">Essentials</text><text x="28" y="468" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">An annual subscription per instance, with</text><text x="28" y="491" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CBD6" text-anchor="start">a 20,000 RU annual base.</text><rect x="28" y="513" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="539" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM bases Concert's pricing on actual usage,</text><text x="28" y="559" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">measured in Resource Units. IBM also lists</text><text x="28" y="579" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Concert Enterprise, by arrangement with IBM.</text><text x="28" y="599" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Source: IBM,</text><text x="28" y="619" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">ibm.com/products/concert/pricing (read</text><text x="28" y="639" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">October 24, 2026).</text></svg>