<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 868" width="360" height="868" role="img" aria-labelledby="evs3p-t evs3p-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="evs3p-t">IBM Confluent Cloud in three of IBM’s figures</title><desc id="evs3p-d">Three of IBM’s figures for IBM Confluent Cloud: a 99.99% uptime SLA for production workloads; 150 pre-built connectors; GBps+ workloads with elastic scaling. The drawing shows one stream of events from a database to an open table. Each figure is IBM’s, from its IBM Confluent page. Confluent’s own page states that the 99.99% uptime SLA applies to production workloads; IBM states no test conditions for the other two.</desc><defs><radialGradient id="evs3p-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="evs3p-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="evs3p-dawn" cx="180" cy="128" r="144" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="evs3p-hz" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="evs3p-ground" cx="180" cy="128" r="130" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 128) scale(1 0.34) translate(-180 -128)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="360" height="868" fill="#262B4B"/><rect width="360" height="128" fill="url(#evs3p-dawn)"/><path d="M106 128A74 74 0 0 1 254 128" fill="none" stroke="#E86877" stroke-width="1.5" stroke-opacity="0.5"/><path d="M96 128A84 84 0 0 1 264 128" fill="none" stroke="#E86877" stroke-width="1.5" stroke-opacity="0.26"/><path d="M116 128A64 64 0 0 1 244 128Z" fill="url(#evs3p-sun)"/><path d="M50 128A130 44 0 0 0 310 128Z" fill="url(#evs3p-ground)"/><rect x="0" y="127" width="360" height="2" fill="url(#evs3p-hz)"/><rect x="132" y="142" width="96" height="4" fill="#E86877" fill-opacity="0.78"/><rect x="148" y="156" width="64" height="4" fill="#E86877" fill-opacity="0.54"/><rect x="163" y="170" width="34" height="4" fill="#E86877" fill-opacity="0.34"/><path d="M34.71 98.24V124.23A12.57 3.77 0 0 0 59.85 124.23V98.24" stroke="#F9F8F5" stroke-width="1.44" fill="#262B4B" stroke-linejoin="miter"/><ellipse cx="47.28" cy="98.24" rx="12.57" ry="3.77" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.44"/><path d="M34.71 106.9A12.57 3.77 0 0 0 59.85 106.9" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M34.71 115.57A12.57 3.77 0 0 0 59.85 115.57" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M65.44 111.24H291.76M288.97 109.28L291.76 111.24L288.97 113.19" stroke="#C9CBD6" stroke-width="1.12" fill="none" stroke-linejoin="miter"/><rect x="82.49" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><rect x="107.63" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><rect x="132.78" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><rect x="157.93" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><circle cx="185.59" cy="111.24" r="8.38" fill="url(#evs3p-halo)"/><rect x="183.91" y="109.56" width="3.35" height="3.35" fill="#FF9640"/><rect x="208.22" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><rect x="233.37" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><rect x="258.51" y="109.28" width="5.03" height="3.91" fill="#262B4B" stroke="#F9F8F5" stroke-width="0.96"/><rect x="294.56" y="100.06" width="33.53" height="27.94" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.44"/><path d="M294.56 105.65H328.09" stroke="#F9F8F5" stroke-width="0.96" fill="none" stroke-linejoin="miter"/><path d="M294.56 111.24H328.09" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M294.56 116.82H328.09" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M294.56 122.41H328.09" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M305.74 100.06V128" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><path d="M316.91 100.06V128" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.7"/><rect x="28" y="204" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="270" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="300" fill="#F9F8F5" text-anchor="start">99.99%</text><text x="28" y="302" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#F9F8F5" text-anchor="start">uptime SLA*</text><text x="28" y="326" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM states it for IBM Confluent Cloud, for</text><text x="28" y="346" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">production workloads.</text><rect x="28" y="368" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="434" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="300" fill="#F9F8F5" text-anchor="start">150</text><text x="28" y="466" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#F9F8F5" text-anchor="start">pre-built connectors*</text><text x="28" y="490" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">For databases, SaaS apps, on-premises</text><text x="28" y="510" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">systems and cloud services.</text><rect x="28" y="532" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="598" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="300" fill="#F9F8F5" text-anchor="start">GBps+</text><text x="28" y="630" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#F9F8F5" text-anchor="start">workloads*</text><text x="28" y="654" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM says IBM Confluent Cloud supports them,</text><text x="28" y="674" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">with elastic scaling.</text><rect x="28" y="696" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="722" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">* Each figure is IBM’s, from its IBM Confluent</text><text x="28" y="742" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">page. Confluent’s own page states that the</text><text x="28" y="762" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">99.99% uptime SLA applies to production</text><text x="28" y="782" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">workloads; IBM states no test conditions for</text><text x="28" y="802" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">the other two.</text><text x="28" y="826" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Sources: ibm.com/products/confluent and</text><text x="28" y="846" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">confluent.io (both read October 24, 2026).</text></svg>