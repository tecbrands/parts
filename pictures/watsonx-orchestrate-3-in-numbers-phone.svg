1"/><rect x="28" y="196" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="252" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="300" fill="#F9F8F5" text-anchor="start">30 days</text><text x="28" y="288" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F9F8F5" text-anchor="start">free trial from IBM</text><text x="28" y="320" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM’s Trial plan: agent building, the</text><text x="28" y="340" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">chat interface, the tools catalog, the</text><text x="28" y="360" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">control plane, and evaluation and</text><text x="28" y="380" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">observability.</text><rect x="28" y="426" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="482" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="300" fill="#F9F8F5" text-anchor="start">On premises</text><text x="28" y="518" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F9F8F5" text-anchor="start">or fully managed on IBM Cloud</text><text x="28" y="544" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F9F8F5" text-anchor="start">or AWS</text><text x="28" y="576" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM says it runs as a fully managed</text><text x="28" y="596" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">multi-cloud service on IBM Cloud or AWS,</text><text x="28" y="616" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">or in your own on-premises environment.</text><rect x="28" y="662" width="304" height="1" fill="#C9CBD6" opacity="0.45"/><text x="28" y="718" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="300" fill="#F9F8F5" text-anchor="start">Per user</text><text x="28" y="754" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F9F8F5" text-anchor="start">and per message</text><text x="28" y="786" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM’s plans set limits on monthly active</text><text x="28" y="806" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">users and on messages per month.</text><text x="28" y="842" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM’s facts, from</text><text x="28" y="860" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#C9CBD6" text-anchor="start">ibm.com/products/watsonx-orchestrate and its</text><text x="28" y="878" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#C9CBD6" text-anchor="start">plans page (no page date shown), read October</text><text x="28" y="896" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#C9CBD6" text-anchor="start">23, 2026.</text></svg>