<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="frc3-t frc3-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="frc3-t">Fraud, risk and compliance in three of IBM’s figures</title><desc id="frc3-d">Three of IBM's figures: Safer Payments 6.10 cuts instance restore time by up to 50% in IBM benchmarks; IBM Trusteer's intelligence network spans millions of devices in 190 countries; IBM lists nine OpenPages modules. Each figure is IBM's, from its Safer Payments, Trusteer and OpenPages pages. The 50% is from IBM benchmarks; IBM states no further conditions.</desc><defs><radialGradient id="frc3-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="frc3-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="frc3-dawn" cx="585" cy="475" r="252" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="frc3-hz" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="frc3-ground" cx="585" cy="475" r="230" gradientUnits="userSpaceOnUse" gradientTransform="translate(585 475) scale(1 0.3) translate(-585 -475)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="628" fill="#262B4B"/><rect width="1200" height="475" fill="url(#frc3-dawn)"/><path d="M455 475A130 130 0 0 1 715 475" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.5"/><path d="M437 475A148 148 0 0 1 733 475" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.26"/><path d="M473 475A112 112 0 0 1 697 475Z" fill="url(#frc3-sun)"/><path d="M355 475A230 70 0 0 0 815 475Z" fill="url(#frc3-ground)"/><rect x="0" y="474" width="1200" height="2" fill="url(#frc3-hz)"/><rect x="500" y="497" width="170" height="5" fill="#E86877" fill-opacity="0.78"/><rect x="529" y="519" width="112" height="5" fill="#E86877" fill-opacity="0.54"/><rect x="555" y="541" width="60" height="5" fill="#E86877" fill-opacity="0.34"/><rect x="56" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="56" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#F9F8F5" text-anchor="start">Up to 50%</text><text x="56" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">faster instance restore</text><text x="56" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Safer Payments 6.10, with its new IBM Aspera,</text><text x="56" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">SCP and rsync support, in IBM benchmarks.</text><rect x="435" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="435" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#F9F8F5" text-anchor="start">190</text><text x="435" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">countries in IBM Trusteer’s</text><text x="435" y="200" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">intelligence network</text><text x="435" y="232" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Millions of devices, each with a unique and</text><text x="435" y="252" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">persistent fingerprint.</text><rect x="814" y="52" width="330" height="1" fill="#C9CBD6" opacity="0.45"/><text x="814" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#F9F8F5" text-anchor="start">9</text><text x="814" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">OpenPages modules</text><text x="814" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">From Business Continuity Management to Policy</text><text x="814" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Management, run within a single environment.</text><path d="M80 377V463A40 12 0 0 0 160 463V377" stroke="#F9F8F5" stroke-width="1.8" fill="#262B4B" stroke-linejoin="miter"/><ellipse cx="120" cy="377" rx="40" ry="12" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.8"/><path d="M80 405.67A40 12 0 0 0 160 405.67" stroke="#C9CBD6" s