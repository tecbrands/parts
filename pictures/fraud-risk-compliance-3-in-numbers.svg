CBD6" stroke-width="1.4"/><rect x="880" y="427" width="38" height="38" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.4"/><rect x="928" y="427" width="38" height="38" fill="#262B4B" stroke="#C9CBD6" stroke-width="1.4"/><rect x="976" y="427" width="38" height="38" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.4"/><text x="56" y="582" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Each figure is IBM's, from its Safer Payments, Trusteer and OpenPages pages. The 50% is from IBM benchmarks; IBM states no further conditions. Source: IBM,</text><text x="56" y="602" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">ibm.com/products/safer-payments, ibm.com/products/trusteer and ibm.com/products/openpages/pricing (read October 24, 2026).</text></svg>