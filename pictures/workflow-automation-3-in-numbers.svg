<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="workflow-automation-3-t workflow-automation-3-d"><style>@font-face{font-family:'IBM Plex Sans';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><title id="workflow-automation-3-t">Cloud Pak for Business Automation in two of IBM’s figures</title><desc id="workflow-automation-3-d">Five capabilities on one platform: workflow automation, decision intelligence, content services, process mining and robotic process automation, as IBM lists them. 30 days: IBM offers a 30-day trial of Business Automation Workflow.</desc><defs><radialGradient id="workflow-automation-3-halo"><stop offset="0" stop-color="#E86877" stop-opacity=".8"/><stop offset=".45" stop-color="#E86877" stop-opacity=".32"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="workflow-automation-3-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E86877"/><stop offset="1" stop-color="#E86877" stop-opacity=".74"/></linearGradient><radialGradient id="workflow-automation-3-dawn" cx="585" cy="424" r="252" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E86877" stop-opacity=".30"/><stop offset=".55" stop-color="#E86877" stop-opacity=".08"/><stop offset="1" stop-color="#E86877" stop-opacity="0"/></radialGradient><linearGradient id="workflow-automation-3-hz" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CBD6" stop-opacity="0"/><stop offset=".07" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset=".93" stop-color="#C9CBD6" stop-opacity=".5"/><stop offset="1" stop-color="#C9CBD6" stop-opacity="0"/></linearGradient><radialGradient id="workflow-automation-3-ground" cx="585" cy="424" r="230" gradientUnits="userSpaceOnUse" gradientTransform="translate(585 424) scale(1 0.3) translate(-585 -424)"><stop offset="0" stop-color="#1E2022" stop-opacity=".34"/><stop offset="1" stop-color="#1E2022" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="580" fill="#262B4B"/><rect width="1200" height="424" fill="url(#workflow-automation-3-dawn)"/><path d="M455 424A130 130 0 0 1 715 424" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.5"/><path d="M437 424A148 148 0 0 1 733 424" fill="none" stroke="#E86877" stroke-width="2" stroke-opacity="0.26"/><path d="M473 424A112 112 0 0 1 697 424Z" fill="url(#workflow-automation-3-sun)"/><path d="M355 424A230 70 0 0 0 815 424Z" fill="url(#workflow-automation-3-ground)"/><rect x="0" y="423" width="1200" height="2" fill="url(#workflow-automation-3-hz)"/><rect x="500" y="446" width="170" height="5" fill="#E86877" fill-opacity="0.78"/><rect x="529" y="468" width="112" height="5" fill="#E86877" fill-opacity="0.54"/><rect x="555" y="490" width="60" height="5" fill="#E86877" fill-opacity="0.34"/><rect x="56" y="52" width="504" height="1" fill="#C9CBD6" opacity="0.45"/><text x="56" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#F9F8F5" text-anchor="start">5</text><text x="56" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">capabilities on one platform</text><text x="56" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">IBM lists workflow automation, decision intelligence, content services,</text><text x="56" y="224" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">process mining and robotic process automation.</text><rect x="640" y="52" width="504" height="1" fill="#C9CBD6" opacity="0.45"/><text x="640" y="132" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#F9F8F5" text-anchor="start">30 days</text><text x="640" y="172" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#F9F8F5" text-anchor="start">trial of Business Automation Workflow</text><text x="640" y="204" font-family="IBM Plex Sans, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CBD6" text-anchor="start">Offered by IBM on its Business Automation Workflow page.</text><rect x="56" y="296.95" width="226.8" height="105" fill="#262B4B" stroke="#F9F8F5" stroke-width="2"/><rect x="60.54" y="301.15" width="217.73" height="96.6" fill="none" stroke="#C9CBD6" stroke-width="1" opacity="0.85"/><path d="M160.33 401.95V418.75M178.47 401.95V418.75" stroke="#F9F8F5" stroke-width="1.6" fill="none" stroke-linejoin="miter"/><rect x="133.11" y="418.75" width="72.58" height="5.25" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.4"/><path d="M61.88 349.45H276.92" stroke="#C9CBD6" stroke-width="0.8" fill="none" stroke-linejoin="miter" opacity="0.35"/><circle cx="79.96" cy="342.22" r="3.22" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.4"/><path d="M83.18 342.22H94.27M91.76 340.43L94.27 342.22L91.76 344.01" stroke="#C9CBD6" stroke-width="1.3" fill="none" stroke-linejoin="miter"/><rect x="94.98" y="335.06" width="32.2" height="14.31" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.4"/><path d="M127.18 342.22H138.63M136.13 340.43L138.63 342.22L136.13 344.01" stroke="#C9CBD6" stroke-width="1.3" fill="none" stroke-linejoin="miter"/><rect x="139.35" y="335.06" width="32.2" height="14.31" fill="#262B4B" stroke="#F9F8F5" stroke-width="1.4"/><path d="M171.55 342.22H182.28M179.78 340.43L182.28 342.22L179.78 344.01" stroke="#C9CBD6" stroke-width="1.3" fill="none" stroke-linejoin="miter"/><path d="M193.01 331.48L203.75 342.22L193.01 352.95L182.28 342.22Z" stroke="#F9F8